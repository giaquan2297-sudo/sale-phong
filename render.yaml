services:
  - type: web
    name: sale-tro-hanoi
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm --prefix web install --include=dev && npm --prefix web run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
